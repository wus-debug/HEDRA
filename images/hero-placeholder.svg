<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Platzhalter-Bild Startseite: durch ein echtes Foto ersetzen (z. B. images/hero.jpg) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4ded1"/>
      <stop offset="0.55" stop-color="#cbc3b4"/>
      <stop offset="1" stop-color="#a89f8f"/>
    </linearGradient>
    <radialGradient id="l" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#l)"/>
  <text x="960" y="1020" text-anchor="middle" font-family="sans-serif" font-size="18" letter-spacing="6" fill="#000" fill-opacity="0.35">PLATZHALTER BILD</text>
</svg>
