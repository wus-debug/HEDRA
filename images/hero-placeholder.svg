<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Platzhalter-Hintergrundbild: durch ein echtes Foto ersetzen (z. B. images/hero.jpg) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9b2a7"/>
      <stop offset="0.55" stop-color="#8f877c"/>
      <stop offset="1" stop-color="#5e574f"/>
    </linearGradient>
    <radialGradient id="l" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#l)"/>
  <text x="960" y="1020" text-anchor="middle" font-family="sans-serif" font-size="18" letter-spacing="6" fill="#fff" fill-opacity="0.55">PLATZHALTER HINTERGRUNDBILD</text>
</svg>
